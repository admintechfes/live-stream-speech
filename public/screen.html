<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Captions</title>
<style>
  :root {
    --size: 52px;
    --brand: #FDB913;
    --pad-x: max(4vw, env(safe-area-inset-left));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    /* dvh so mobile browser chrome collapsing does not clip the last line */
    height: 100dvh;
    font-family: "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    -webkit-text-size-adjust: 100%;
  }
  body.idle { cursor: none; }

  /* ---- top bar: brand left, standing disclaimer right ------------------- */
  #bar {
    flex: 0 0 auto;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: max(2.2vh, env(safe-area-inset-top)) var(--pad-x) 0;
  }
  #brand {
    /* The logo is dark artwork; on a black wall it needs its own light ground
       rather than a filter, which would wreck the brand colour. */
    background: #fff; border-radius: 8px; padding: 5px 9px;
    display: inline-flex; align-items: center;
  }
  #brand img { display: block; height: clamp(20px, 3.2vh, 42px); width: auto; }
  #brandWrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  /* Setup aid — deliberately unobtrusive during the event. */
  #label {
    font-size: clamp(11px, 1.5vh, 18px); font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--brand); opacity: 0.75; display: none;
  }
  body.labelled #label { display: block; }
  /* Legible to anyone who looks for it, out of the way of anyone reading. */
  #notice {
    font-size: clamp(11px, 1.45vh, 19px);
    font-weight: 600; letter-spacing: 0.03em; line-height: 1.35;
    color: var(--brand); opacity: 0.85;
    text-align: right; max-width: 46%;
  }

  /* ---- captions --------------------------------------------------------- */
  #captions {
    margin-top: auto;                 /* bottom-anchored, never under the bar */
    padding: 2vh var(--pad-x) max(5vh, calc(env(safe-area-inset-bottom) + 3vh));
    /* One rule for every screen: the operator's size on anything big enough
       for it, and viewport-bound on a phone so it cannot overflow. */
    font-size: max(19px, min(var(--size), 7.6vw, 11vh));
    line-height: 1.26;
    font-weight: 600;
    letter-spacing: 0.005em;
    text-wrap: pretty;
    overflow-wrap: anywhere;
  }
  .line { margin-top: 0.32em; transition: opacity 140ms linear; }
  .line:first-child { margin-top: 0; }
  /* The live, still-settling line — brand yellow so it reads as distinct from
     the committed white lines above it. */
  .partial { color: var(--brand); }
  #captions.blanked { visibility: hidden; }

  /* ---- status + touch affordances --------------------------------------- */
  #dot {
    position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); right: 12px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #1f8f4a; opacity: 0.5;
  }
  #dot.down { background: #d04a2a; opacity: 1; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }

  #full {
    position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 12px;
    display: none; width: 44px; height: 44px;   /* 44px: a real touch target */
    align-items: center; justify-content: center;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px; color: var(--brand); font-size: 19px; line-height: 1;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  /* Touch devices only — a hall TV should show no chrome at all. */
  @media (hover: none) and (pointer: coarse) { #full { display: flex; } }

  /* ---- fatal card ------------------------------------------------------- */
  #fatal {
    display: none; margin: auto; padding: 5vh 6vw; text-align: center;
    border: 3px solid #d04a2a; border-radius: 14px; max-width: 88vw;
  }
  #fatal h1 { font-size: clamp(30px, 7vw, 68px); color: #ff6a45; letter-spacing: 0.04em; }
  #fatal p { font-size: clamp(15px, 2.6vw, 26px); color: #98a2ad; margin-top: 18px; line-height: 1.5; }
  body.fatal #captions, body.fatal #dot, body.fatal #bar, body.fatal #full { display: none; }
  body.fatal #fatal { display: block; }

  /* Landscape on a phone is mostly bezel — reclaim the vertical space. */
  @media (orientation: landscape) and (max-height: 460px) {
    #bar { padding-top: 1vh; }
    #captions { padding-bottom: 2vh; }
    #brand img { height: 20px; }
  }
</style>
</head>
<body>
  <header id="bar">
    <div id="brandWrap">
      <span id="brand"><img src="assets/madhi_black_logo_4e0551fa8d.png" alt="Madhi"></span>
      <span id="label"></span>
    </div>
    <div id="notice">AI-generated translation &middot; may contain errors</div>
  </header>

  <div id="captions" aria-live="polite"></div>

  <button id="full" title="Fullscreen" aria-label="Toggle fullscreen">&#9974;</button>
  <div id="dot" class="down"></div>
  <div id="fatal"><h1 id="fatalTitle">NOT CONFIGURED</h1><p id="fatalBody"></p></div>

<script>
(() => {
  const params = new URLSearchParams(location.search)
  const hall = (params.get('hall') || '').trim()
  const size = params.get('size')
  const lines = Number(params.get('lines') || 3)
  const label = params.get('label') === '1'
  // The disclaimer is on by default — it is the kind of thing that gets
  // switched off "just for this screen" and then never explained to anyone.
  // ?notice=0 removes it; ?notice=<text> replaces the wording.
  const notice = params.get('notice')
  const logo = params.get('logo')

  const $ = (id) => document.getElementById(id)
  const $captions = $('captions')
  const $dot = $('dot')

  let maxLines = Math.max(1, lines)
  if (size) document.documentElement.style.setProperty('--size', /^\d+$/.test(size) ? size + 'px' : size)
  if (label) { document.body.classList.add('labelled'); $('label').textContent = hall || 'no hall' }
  if (logo === '0' || logo === 'off') $('brand').style.display = 'none'

  const $notice = $('notice')
  if (notice === '0' || notice === 'off') $notice.style.display = 'none'
  else if (notice) $notice.textContent = notice

  function fatal(title, body) {
    document.body.classList.add('fatal')
    $('fatalTitle').textContent = title
    $('fatalBody').textContent = body
  }

  // A screen with no hall shows an obviously broken card rather than guessing.
  // Silent mis-routing is the failure nobody notices until it is on a wall.
  if (!hall) {
    fatal('NOT CONFIGURED', 'This screen has no hall assigned. Open it as  /screen.html?hall=<hall-id>')
    return
  }

  let finals = []
  let partial = ''
  let frozen = false
  let blanked = false

  function render() {
    if (frozen) return
    $captions.classList.toggle('blanked', blanked)
    const visible = finals.slice(-Math.max(1, maxLines - (partial ? 1 : 0)))
    const html = visible.map((t) => `<div class="line">${esc(t)}</div>`)
    if (partial) html.push(`<div class="line partial">${esc(partial)}</div>`)
    $captions.innerHTML = html.join('')
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  }

  // Reconnect forever, and keep the last captions on screen while doing it.
  // A 10-second blip should be invisible to the audience, not a black wall.
  let ws = null
  let backoff = 500

  // Derived from this page's own URL, not hardcoded — works whether this app
  // is mounted at the domain root or under a path prefix like /live-stream/.
  const BASE = location.pathname.replace(/[^/]*$/, '')

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws'
    ws = new WebSocket(`${proto}://${location.host}${BASE}ws?role=screen&hall=${encodeURIComponent(hall)}`)

    ws.onopen = () => { backoff = 500; $dot.classList.remove('down') }

    ws.onmessage = (ev) => {
      let m
      try { m = JSON.parse(ev.data) } catch { return }
      switch (m.type) {
        case 'hello':
          finals = m.finals || []
          partial = m.partial || ''
          blanked = Boolean(m.blanked)
          frozen = Boolean(m.frozen)
          render()
          break
        case 'final':
          partial = ''
          finals.push(m.text)
          if (finals.length > 100) finals = finals.slice(-100)
          render()
          break
        case 'partial':
          partial = m.text
          render()
          break
        case 'blank':
          blanked = m.value
          $captions.classList.toggle('blanked', blanked)
          break
        case 'freeze':
          frozen = m.value
          if (!frozen) render()
          break
        case 'clear':
          finals = []; partial = ''; frozen = false; render()
          break
        case 'style':
          if (m.size) document.documentElement.style.setProperty('--size', m.size + 'px')
          if (m.lines) { maxLines = m.lines; render() }
          break
        case 'error':
          fatal(m.code === 'unknown_hall' ? 'UNKNOWN HALL' : 'NOT CONFIGURED', m.message)
          ws.onclose = null
          break
      }
    }

    ws.onclose = () => {
      $dot.classList.add('down')
      // Jitter matters at scale: without it, a relay restart brings every
      // viewer back in lockstep and the reconnect burst is what kills the
      // recovery, not the restart. Spread each client over its own window.
      setTimeout(connect, backoff * (0.5 + Math.random()))
      backoff = Math.min(backoff * 1.7, 8000)
    }
    ws.onerror = () => ws.close()
  }

  connect()

  // Hide the cursor when nobody is moving it, rather than always: a hall TV
  // ends up clean, and a viewer on a laptop can still find their pointer.
  let idleTimer = null
  const wake = () => {
    document.body.classList.remove('idle')
    clearTimeout(idleTimer)
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000)
  }
  document.addEventListener('mousemove', wake, { passive: true })
  wake()

  $('full').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen()
    else document.documentElement.requestFullscreen().catch(() => {})
  }

  // Keep screens — TVs and phones alike — from sleeping mid-session.
  if ('wakeLock' in navigator) {
    const hold = () => navigator.wakeLock.request('screen').catch(() => {})
    hold()
    document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && hold())
  }
})()
</script>
</body>
</html>
