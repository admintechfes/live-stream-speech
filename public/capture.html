<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture — Event Captions</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: #12161b; color: #e7ecf2;
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: 0.01em; }
  .sub { color: #8b97a5; font-size: 13px; margin-bottom: 20px; }
  .card { background: #1a2027; border: 1px solid #29323c; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b97a5; margin-bottom: 6px; }
  select, input {
    width: 100%; padding: 9px 11px; background: #0e1216; color: #e7ecf2;
    border: 1px solid #333e4a; border-radius: 7px; font-size: 14px;
  }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1 1 220px; }
  button {
    font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer;
  }
  #start { background: #1f8f4a; color: #fff; }
  #stop { background: #2a333d; color: #e7ecf2; border-color: #3c4753; }
  button:disabled { opacity: 0.4; cursor: default; }
  .status { display: flex; align-items: center; gap: 9px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #55606c; }
  .dot.live { background: #2fbf6a; box-shadow: 0 0 0 4px rgba(47,191,106,0.15); }
  .dot.warn { background: #e0a92b; }
  .dot.err  { background: #d04a2a; }
  #meter { height: 12px; background: #0e1216; border-radius: 6px; overflow: hidden; border: 1px solid #333e4a; }
  #meterFill { height: 100%; width: 0%; background: linear-gradient(90deg, #2fbf6a 0 62%, #e0a92b 62% 85%, #d04a2a 85%); transition: width 60ms linear; }
  .hint { font-size: 12px; color: #8b97a5; margin-top: 6px; }
  #monitors { display: flex; gap: 14px; flex-wrap: wrap; }
  .lang {
    flex: 1 1 300px; background: #0e1216; border: 1px solid #29323c;
    border-radius: 8px; padding: 12px 14px;
  }
  .langhead { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .langname { font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; }
  .langage { margin-left: auto; font-size: 12px; color: #8b97a5; }
  .langtext { min-height: 104px; font-size: 16px; line-height: 1.45; }
  .langtext .fin { margin-bottom: 6px; }
  .langtext .par { color: #FDB913; }
  .langtext em { color: #6c7885; font-style: normal; }
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #7d8895; max-height: 150px; overflow-y: auto; white-space: pre-wrap; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; background: #223042; color: #7fb3e8;
    border: 1px solid #31465e; vertical-align: middle;
  }
  .banner { padding: 12px 14px; border-radius: 8px; background: #3a1d16; border: 1px solid #7a3520; color: #ffb59c; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
  <h1>Capture — <span id="hallName">?</span> <span id="providerBadge" class="badge"></span></h1>
  <div class="sub">Feed this page from the AV mixer line-out via the USB audio interface. Never a room mic.</div>

  <div class="banner" id="banner"></div>

  <div class="card">
    <div class="row">
      <div>
        <label for="device">Audio input</label>
        <select id="device"></select>
        <div class="hint">Pick the USB interface, not the built-in mic.</div>
      </div>
      <div>
        <label>Input level — aim for peaks around 70&ndash;80%, never pinned</label>
        <div id="meter"><div id="meterFill"></div></div>
        <div class="hint" id="levelHint">&mdash;</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="align-items:center">
      <div style="flex:0 0 auto"><button id="start">Start captions</button></div>
      <div style="flex:0 0 auto"><button id="stop" disabled>Stop</button></div>
      <div class="status"><span class="dot" id="recDot"></span><span id="recState">idle</span></div>
      <div class="status"><span class="dot" id="wsDot"></span><span id="wsState">relay offline</span></div>
    </div>
  </div>

  <div class="card">
    <label>Live monitor — every language must be moving</label>
    <div id="monitors"><em style="color:#6c7885">press Start</em></div>
  </div>

  <div class="card">
    <label>Log</label>
    <div id="log"></div>
  </div>

<script src="vendor/speech-sdk.js" onerror="this.dataset.failed=1"></script>
<script>
window.SPEECH_SDK_FALLBACK = !window.SpeechSDK
</script>
<script>
// Only reach for the CDN if the local bundle is missing AND this page is
// actually going to use Azure — a Soniox hall should not pull ~700KB over
// venue wifi for an engine it will never start.
if (window.SPEECH_SDK_FALLBACK && (new URLSearchParams(location.search).get('provider') || 'azure') === 'azure') {
  document.write('<script src="https://aka.ms/csspeech/jsbrowserpackageraw"><\/script>')
}
</script>
<script>
(() => {
  const params = new URLSearchParams(location.search)
  const hall = (params.get('hall') || '').trim()
  const key = params.get('key') || ''
  // Per-hall engine override, so one hall can be flipped to the other provider
  // mid-event (or during an A/B) without touching .env on the server.
  const providerOverride = (params.get('provider') || '').trim()

  const $ = (id) => document.getElementById(id)
  const banner = (msg) => { $('banner').style.display = 'block'; $('banner').textContent = msg }
  const log = (msg) => {
    const t = new Date().toTimeString().slice(0, 8)
    $('log').textContent = `${t}  ${msg}\n` + $('log').textContent.split('\n').slice(0, 120).join('\n')
  }

  $('hallName').textContent = hall || 'NO HALL SET'
  if (!hall) {
    banner('No hall specified. Open this page as /capture.html?hall=<hall-id>.')
    $('start').disabled = true
    return
  }

  // Derived from this page's own URL — works mounted at root or under a path
  // prefix like /live-stream/ without any nginx-side path rewriting.
  const BASE = location.pathname.replace(/[^/]*$/, '')

  let cfg = null          // whatever /api/token returned for the active provider
  let ws = null
  let wsBackoff = 500
  let drivers = []        // one per target language (Soniox) or one for all (Azure)
  let targets = []        // the target languages this hall is carrying
  let sharedStream = null // one microphone, shared across every language session
  let running = false
  let lastEventTs = 0
  let tokenTimer = null
  let watchdogTimer = null

  // ---- relay ---------------------------------------------------------------

  function connectWs() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws'
    const q = `role=publisher&hall=${encodeURIComponent(hall)}&key=${encodeURIComponent(key)}`
    ws = new WebSocket(`${proto}://${location.host}${BASE}ws?${q}`)

    ws.onopen = () => { wsBackoff = 500; setWs('live', 'relay connected') }
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data)
      if (m.type === 'error') {
        setWs('err', m.code)
        banner(m.message + (m.code === 'publisher_taken' ? ' Close the other capture tab, then reload.' : ''))
        ws.onclose = null
      }
    }
    ws.onclose = () => {
      setWs('err', 'relay offline — retrying')
      setTimeout(connectWs, wsBackoff)
      wsBackoff = Math.min(wsBackoff * 1.7, 8000)
    }
    ws.onerror = () => ws.close()
  }

  function publish(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj))
  }

  const setWs = (cls, text) => { $('wsDot').className = 'dot ' + cls; $('wsState').textContent = text }
  const setRec = (cls, text) => { $('recDot').className = 'dot ' + cls; $('recState').textContent = text }

  // ---- audio device list + level meter ------------------------------------

  async function initAudio() {
    try {
      await navigator.mediaDevices.getUserMedia({ audio: true })
    } catch (err) {
      banner('Microphone permission denied. This page must be served over HTTPS and allowed to use audio.')
      throw err
    }
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput')
    $('device').innerHTML = devices
      .map((d) => `<option value="${d.deviceId}">${d.label || 'Input ' + d.deviceId.slice(0, 6)}</option>`)
      .join('')
    $('device').onchange = () => startMeter($('device').value)
    if (devices.length) startMeter(devices[0].deviceId)
  }

  let meterCtx = null
  async function startMeter(deviceId) {
    if (meterCtx) { meterCtx.close(); meterCtx = null }
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { deviceId: { exact: deviceId }, echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    })
    meterCtx = new AudioContext()
    const src = meterCtx.createMediaStreamSource(stream)
    const analyser = meterCtx.createAnalyser()
    analyser.fftSize = 1024
    src.connect(analyser)
    const buf = new Float32Array(analyser.fftSize)
    let peak = 0
    ;(function tick() {
      if (!meterCtx) return
      analyser.getFloatTimeDomainData(buf)
      let max = 0
      for (const v of buf) max = Math.max(max, Math.abs(v))
      peak = Math.max(max, peak * 0.92)
      const pct = Math.min(100, peak * 100)
      $('meterFill').style.width = pct.toFixed(0) + '%'
      const db = peak > 0 ? (20 * Math.log10(peak)).toFixed(1) : '-inf'
      $('levelHint').textContent =
        `peak ${db} dBFS — ` + (peak > 0.95 ? 'CLIPPING, ask AV to drop the send' : peak < 0.05 ? 'too quiet / no feed' : 'good')
      requestAnimationFrame(tick)
    })()
  }

  // ---- recognizer: one interface, two engines ------------------------------
  //
  // Everything above and below this section is engine-agnostic. A driver takes
  // the credential payload and a device, and calls back with plain text lines.
  // Nothing else in this file — relay, meter, watchdog, restart — branches on
  // which provider is running.

  async function fetchToken() {
    const q = new URLSearchParams({ key, hall })
    if (providerOverride) q.set('provider', providerOverride)
    const res = await fetch(BASE + 'api/token?' + q)
    if (!res.ok) throw new Error('token endpoint: ' + res.status + ' ' + (await res.text()))
    return res.json()
  }

  function handlersFor(targetLang) {
    return {
      onEvent: () => { lastEventTs = Date.now(); markLang(targetLang) },
      onPartial: (text, lang) => {
        if (!text) return
        publish({ type: 'partial', text, targetLang, lang })
        paintLang(targetLang, text, true)
      },
      onFinal: (text, lang) => {
        if (!text || !text.trim()) return
        publish({ type: 'final', text, targetLang, lang })
        paintLang(targetLang, text, false)
      },
      onLog: (m) => log(`[${targetLang}] ${m}`),
      onRetry: (reason) => {
        // One dead session must be visible on the operator console even while
        // the other keeps producing — otherwise a live publisher hides it.
        publish({ type: 'status', state: 'session', targetLang, live: false })
        setRec('err', `${targetLang}: ${reason}`)
        if (running) restart(`${targetLang}: ${reason}`)
      },
    }
  }

  async function startRecognizer() {
    cfg = await fetchToken()
    $('providerBadge').textContent = cfg.provider
    targets = (cfg.targetLanguages && cfg.targetLanguages.length) ? cfg.targetLanguages : ['en']
    buildMonitors(targets)

    if (cfg.provider === 'soniox') {
      // Soniox translates to ONE target per session, so N languages means N
      // sessions. They share a single microphone stream: opening the device
      // twice would mean a second permission prompt and device contention.
      sharedStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          deviceId: { exact: $('device').value },
          echoCancellation: false, noiseSuppression: false, autoGainControl: false,
        },
      })
      for (const lang of targets) {
        drivers.push(await sonioxDriver(cfg, lang, sharedStream, handlersFor(lang)))
      }
    } else {
      // Azure does every target in one session, so the whole hall costs the
      // same whether it carries one language or three.
      drivers.push(await azureDriver(cfg, targets, $('device').value, handlersFor))
    }

    lastEventTs = Date.now()
    setRec('live', 'recognizing')
    log(`recognizer started (${cfg.provider}, ${targets.join(' + ')})`)
    publish({ type: 'status', state: 'started', provider: cfg.provider })
    for (const lang of targets) publish({ type: 'status', state: 'session', targetLang: lang, live: true })

    // Azure auth tokens last ~10 minutes; refresh well inside that. Soniox
    // keys are only used at connect time, so its driver has nothing to refresh.
    clearInterval(tokenTimer)
    if (drivers.some((d) => d.refreshCredential)) {
      tokenTimer = setInterval(async () => {
        try {
          const fresh = await fetchToken()
          for (const d of drivers) if (d.refreshCredential) await d.refreshCredential(fresh)
          log('auth token refreshed')
        } catch (err) {
          log('token refresh failed: ' + err.message)
        }
      }, 7 * 60 * 1000)
    }
  }

  // ---- Azure driver --------------------------------------------------------

  async function azureDriver(cfg, targetLangs, deviceId, handlersFor) {
    const S = window.SpeechSDK
    if (!S) throw new Error('Speech SDK failed to load (no local bundle and no internet).')

    // One handler set per language, so the driver interface stays identical to
    // Soniox's from the caller's point of view.
    const H = new Map(targetLangs.map((l) => [l, handlersFor(l)]))
    const anyLog = (m) => H.get(targetLangs[0]).onLog(m)

    const speechConfig = S.SpeechTranslationConfig.fromAuthorizationToken(cfg.token, cfg.region)
    for (const l of targetLangs) speechConfig.addTargetLanguage(l)
    // Continuous LID: speakers switch between Tamil, Hindi and English mid-talk
    // and no operator should have to notice.
    speechConfig.setProperty(S.PropertyId.SpeechServiceConnection_LanguageIdMode, 'Continuous')
    speechConfig.setProfanity(S.ProfanityOption.Masked)

    const autoDetect = S.AutoDetectSourceLanguageConfig.fromLanguages(cfg.sourceLanguages)
    const audioConfig = S.AudioConfig.fromMicrophoneInput(deviceId)
    const recognizer = S.TranslationRecognizer.FromConfig(speechConfig, autoDetect, audioConfig)

    if (cfg.phraseList && cfg.phraseList.length) {
      const grammar = S.PhraseListGrammar.fromRecognizer(recognizer)
      cfg.phraseList.forEach((p) => grammar.addPhrase(p))
      anyLog(`phrase list: ${cfg.phraseList.length} entries`)
    }

    const detected = (e) => {
      try {
        return S.AutoDetectSourceLanguageResult.fromResult(e.result).language || null
      } catch { return null }
    }

    // Azure returns one translation per target from a single recognition, so
    // every language is fed from the same event — they cannot drift apart.
    const fanOut = (e, method) => {
      const src = detected(e)
      for (const l of targetLangs) {
        const h = H.get(l)
        h.onEvent()
        const text = e.result.translations && e.result.translations.get(l)
        if (text) h[method](text, src)
      }
    }

    recognizer.recognizing = (_s, e) => fanOut(e, 'onPartial')
    recognizer.recognized = (_s, e) => fanOut(e, 'onFinal')

    recognizer.canceled = (_s, e) => {
      anyLog(`canceled: ${e.errorDetails || e.reason}`)
      H.get(targetLangs[0]).onRetry('canceled — restarting')
    }

    recognizer.sessionStopped = () => {
      anyLog('session stopped')
      H.get(targetLangs[0]).onRetry('sessionStopped')
    }

    await new Promise((resolve, reject) => recognizer.startContinuousRecognitionAsync(resolve, reject))

    return {
      async refreshCredential(fresh) {
        recognizer.authorizationToken = fresh.token
      },
      async stop() {
        // Detach first: a deliberate stop must not look like a failure and
        // trigger the restart loop.
        recognizer.canceled = null
        recognizer.sessionStopped = null
        await new Promise((resolve) => recognizer.stopContinuousRecognitionAsync(resolve, resolve))
        try { recognizer.close() } catch {}
      },
    }
  }

  // ---- Soniox driver -------------------------------------------------------

  async function loadSonioxSdk() {
    try {
      return await import(BASE + 'vendor/soniox-sdk.js')
    } catch (err) {
      log('local Soniox SDK unavailable — falling back to CDN')
      return await import('https://unpkg.com/@soniox/speech-to-text-web?module')
    }
  }

  async function sonioxDriver(cfg, targetLang, stream, h) {
    const { SonioxClient } = await loadSonioxSdk()

    // Soniox streams tokens, not lines: finals arrive once and accumulate,
    // non-finals are replaced on every message. We rebuild the line model the
    // relay already speaks — which is why endpoint detection is mandatory
    // below, not optional. Without an endpoint no final is ever emitted, and
    // the replay buffer, review delay and blank-drops-in-flight all sit idle.
    const FLUSH_CHARS = 200
    let finalBuffer = ''
    let lastLang = null
    let stopped = false

    // THE RULE that makes every language stream stay live whatever is spoken.
    //
    // A one_way session with target L emits `translation` tokens while the
    // speaker is in some other language. The moment they switch INTO L there is
    // nothing left to translate, so Soniox emits `original` tokens instead. Take
    // both: translations always, and originals only when they are already in
    // this session's language. Anything else is the untranslated source, which
    // has a translated counterpart and would double the line.
    //
    // This also handles mid-sentence code-switching for free: in a Tamil-then-
    // English sentence the `en` session takes translated text for the Tamil half
    // and original text for the English half, and `ta` does the mirror image.
    const base = (code) => String(code || '').toLowerCase().split(/[-_]/)[0]
    const target = base(targetLang)
    const keep = (t) => {
      if (t.translation_status === 'translation') return true
      return base(t.language || t.source_language) === target
    }

    const flush = () => {
      const text = finalBuffer.trim()
      finalBuffer = ''
      if (text) h.onFinal(text, lastLang)
    }

    const client = new SonioxClient({
      apiKey: cfg.apiKey,
      // Halls have long silences between speakers; without this the socket
      // times out and every gap costs a reconnect.
      keepAlive: true,
      onError: (status, message) => {
        if (stopped) return
        h.onLog(`soniox error: ${status}${message ? ' — ' + message : ''}`)
        h.onRetry(`soniox ${status}`)
      },
      onFinished: () => {
        if (stopped) return
        flush()
        h.onLog('soniox session finished')
        h.onRetry('session finished')
      },
      onPartialResult: (result) => {
        h.onEvent()
        let nonFinal = ''
        let endpoint = false

        for (const t of result.tokens || []) {
          // Control tokens carry no text and must never reach a wall.
          if (t.text === '<end>') { endpoint = true; continue }
          if (t.text === '<fin>') continue
          if (!keep(t)) continue
          if (t.source_language || t.language) lastLang = t.source_language || t.language
          if (t.is_final) finalBuffer += t.text
          else nonFinal += t.text
        }

        // Force-flush an unbroken monologue so one caption line cannot grow
        // without limit when the speaker never pauses.
        if (endpoint || finalBuffer.length > FLUSH_CHARS) flush()

        const pending = (finalBuffer + nonFinal).trim()
        if (pending) h.onPartial(pending, lastLang)
      },
    })

    await client.start({
      model: cfg.model,
      languageHints: cfg.languageHints,
      enableLanguageIdentification: true,
      enableEndpointDetection: true,
      translation: { type: 'one_way', target_language: targetLang },
      ...(cfg.context ? { context: cfg.context } : {}),
      // Every language session shares one already-open microphone stream, so
      // there is no second permission prompt and no device contention.
      stream,
    })

    if (cfg.context && cfg.context.terms) h.onLog(`context terms: ${cfg.context.terms.length}`)

    return {
      async stop() {
        stopped = true
        client.cancel()
      },
    }
  }

  // ---- per-language monitors ------------------------------------------------
  //
  // A hall minder must be able to see that BOTH languages are producing, not
  // just that "captions are working". One panel per language, side by side.

  const LANG_NAMES = { en: 'English', ta: 'தமிழ் Tamil', hi: 'हिन्दी Hindi' }
  const langState = new Map() // lang -> { finals: [], lastTs }

  function buildMonitors(langs) {
    langState.clear()
    $('monitors').innerHTML = langs.map((l) => `
      <div class="lang" data-lang="${l}">
        <div class="langhead">
          <span class="dot" data-ldot></span>
          <span class="langname">${escapeHtml(LANG_NAMES[l] || l)}</span>
          <span class="langage" data-lage>waiting</span>
        </div>
        <div class="langtext" data-ltext><em>no captions yet</em></div>
      </div>`).join('')
    for (const l of langs) langState.set(l, { finals: [], lastTs: 0 })
  }

  const langEl = (l, sel) => document.querySelector(`.lang[data-lang="${l}"] [${sel}]`)

  function markLang(l) {
    const s = langState.get(l)
    if (s) s.lastTs = Date.now()
  }

  function paintLang(l, text, isPartial) {
    const s = langState.get(l)
    if (!s) return
    if (!isPartial) {
      s.finals.push(text)
      if (s.finals.length > 4) s.finals.shift()
    }
    const html = s.finals.map((t) => `<div class="fin">${escapeHtml(t)}</div>`)
    if (isPartial && text) html.push(`<div class="par">${escapeHtml(text)}</div>`)
    const el = langEl(l, 'data-ltext')
    if (el) el.innerHTML = html.join('') || '<em>no captions yet</em>'
  }

  // A language that has gone quiet while the other keeps running is the exact
  // failure this whole panel exists to surface.
  setInterval(() => {
    for (const [l, s] of langState) {
      const dot = langEl(l, 'data-ldot')
      const age = langEl(l, 'data-lage')
      if (!dot || !age) continue
      if (!running || !s.lastTs) { dot.className = 'dot'; age.textContent = running ? 'waiting' : 'idle'; continue }
      const secs = Math.round((Date.now() - s.lastTs) / 1000)
      dot.className = 'dot ' + (secs > 25 ? 'err' : secs > 10 ? 'warn' : 'live')
      age.textContent = secs < 2 ? 'flowing' : `${secs}s ago`
    }
  }, 1000)

  const escapeHtml = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))

  async function stopRecognizer() {
    clearInterval(tokenTimer)
    const list = drivers.splice(0)
    // All languages go down together. A partial teardown that leaves English
    // live and Tamil dead is worse than a two-second gap in both.
    for (const d of list) {
      try { await d.stop() } catch (err) { log('stop failed: ' + err.message) }
    }
    if (sharedStream) {
      sharedStream.getTracks().forEach((t) => t.stop())
      sharedStream = null
    }
  }

  let restarting = false
  async function restart(reason) {
    if (restarting) return
    restarting = true
    log('restarting recognizer: ' + reason)
    setRec('warn', 'restarting')
    publish({ type: 'status', state: 'restarting', reason })
    try {
      await stopRecognizer()
      await new Promise((r) => setTimeout(r, 800))
      if (running) await startRecognizer()
    } catch (err) {
      log('restart failed: ' + err.message)
      setRec('err', 'restart failed')
      if (running) setTimeout(() => { restarting = false; restart('retry') }, 3000)
      return
    }
    restarting = false
  }

  // Watchdog: the recognizer occasionally goes quiet without firing an event.
  // If nothing has come back for 20s while we are supposed to be live, cycle it.
  watchdogTimer = setInterval(() => {
    if (!running || restarting || !lastEventTs) return
    if (Date.now() - lastEventTs > 20000) restart('watchdog: 20s silent')
  }, 5000)

  // ---- controls ------------------------------------------------------------

  $('start').onclick = async () => {
    $('start').disabled = true
    running = true
    try {
      await startRecognizer()
      $('stop').disabled = false
    } catch (err) {
      running = false
      $('start').disabled = false
      setRec('err', 'failed')
      banner(err.message)
      log('start failed: ' + err.message)
    }
  }

  $('stop').onclick = async () => {
    running = false
    $('stop').disabled = true
    await stopRecognizer()
    setRec('', 'stopped')
    $('start').disabled = false
    log('stopped by operator')
  }

  window.addEventListener('beforeunload', (e) => {
    if (running) { e.preventDefault(); e.returnValue = '' }
  })

  connectWs()
  initAudio().catch(() => {})

  // Show the engine before Start is pressed, so a minder can see at a glance
  // that this hall is on the one the run sheet says it should be.
  $('providerBadge').textContent = providerOverride || '…'
  if (!providerOverride) {
    fetch(BASE + 'api/config')
      .then((r) => r.json())
      .then((c) => { $('providerBadge').textContent = c.provider || '?' })
      .catch(() => { $('providerBadge').textContent = '?' })
  }
})()
</script>
</body>
</html>
